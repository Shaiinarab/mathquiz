<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آزمون تطبیقی دانش</title>
  <style>
    :root { --bg:#0b1020; --card:#141a33; --muted:#9aa4c7; --text:#e8ecff; --accent:#6ea8fe; --ok:#4ade80; --bad:#f87171; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Vazirmatn", Tahoma, "Segoe UI", sans-serif; background:linear-gradient(180deg,#0b1020,#0f1630); color:var(--text); direction: rtl; }
    main { max-width: 900px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    p.lead { color: var(--muted); margin-top:0; }
    .card { background:var(--card); border:1px solid #243055; border-radius:14px; padding:20px; margin:16px 0; box-shadow:0 10px 30px rgba(0,0,0,.25); }
    .row { display:flex; gap:12px; flex-wrap:wrap; }
    label { display:block; margin:8px 0 4px; color:var(--muted); font-size:.95rem; }
    select,input[type=text] { width:100%; padding:10px 12px; border-radius:10px; border:1px solid #33406b; background:#0f1530; color:var(--text); }
    button { background:var(--accent); color:#081225; border:0; padding:10px 14px; border-radius:10px; font-weight:600; cursor:pointer; }
    button.secondary { background:#243055; color:var(--text); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .choices { display:grid; gap:10px; margin-top:12px; }
    .choice { padding:12px; border:1px solid #33406b; border-radius:10px; background:#0f1530; cursor:pointer; text-align:right; color:var(--text); }
    .choice:hover { border-color:var(--accent); }
    .choice.selected { border-color:var(--accent); background:#162247; }
    .meta { color:var(--muted); font-size:.9rem; }
    .bar { height:10px; background:#243055; border-radius:999px; overflow:hidden; margin-top:8px; }
    .bar > span { display:block; height:100%; background:linear-gradient(270deg,var(--accent),#8bd3ff); }
    .grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:#243055; color:var(--muted); font-size:.8rem; margin-left:6px; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    .hidden { display:none; }
    ul { margin:8px 18px 0 0; color:var(--muted); padding:0; }
  </style>
</head>
<body>
<main>
  <h1>آزمون تطبیقی دانش</h1>
  <p class="lead">راه‌انداز دستی + کاوش تقسیم و حل برای برآورد دانش در نقشه مهارت‌ها.</p>

  <section id="wizard" class="card">
    <h2>۱) راه‌انداز تنظیمات</h2>
    <div class="row">
      <div style="flex:1 1 260px">
        <label for="profession">حرفه / هدف</label>
        <select id="profession"></select>
      </div>
      <div style="flex:1 1 260px">
        <label for="domain">مجموعه مهارت / حوزه</label>
        <select id="domain"></select>
      </div>
    </div>
    <label for="focus">تمرکز (اختیاری، موضوع‌ها با ویرگول جدا شوند)</label>
    <input id="focus" type="text" placeholder="مثلاً انتگرال، دستگاه‌های خطی">
    <p class="meta" id="wizardMeta"></p>
    <button id="startBtn">شروع آزمون تطبیقی</button>
  </section>

  <section id="quiz" class="card hidden">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div>
        <span class="pill" id="qDomain"></span>
        <span class="pill" id="qTopic"></span>
        <span class="pill" id="qDiff"></span>
      </div>
      <div class="meta" id="progress"></div>
    </div>
    <h2 id="qText" style="margin-top:12px"></h2>
    <div id="choices" class="choices"></div>
    <div class="row" style="margin-top:14px">
      <button id="submitBtn" disabled>ثبت پاسخ</button>
      <button id="skipBtn" class="secondary">رد کردن / نمی‌دانم</button>
    </div>
    <p class="meta" id="engineNote"></p>
  </section>

  <section id="result" class="card hidden">
    <h2>نمایه دانش</h2>
    <p class="meta" id="summary"></p>
    <div id="profile" class="grid"></div>
    <h3 style="margin-top:18px">ردیابی روش</h3>
    <ul id="trace"></ul>
    <div class="row" style="margin-top:16px">
      <button id="restartBtn">اجرای دوباره</button>
    </div>
  </section>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
